<style>

op:29%}.arch.c{width:38%;height:28%;left:31%;top:38%}.toast{position:fixed;left:50%;top:86px;transform:translateX(-50%) translateY(-8px);z-index:60;background:rgba(25,11,7,.74);border:1px solid rgba(255,220,160,.25);color:var(--ivory);padding:10px 16px;border-radius:999px;font-family:Inter,'Avenir Next',sans-serif;font-size:.78rem;letter-spacing:.08em;opacity:0;pointer-events:none;transition:.5s var(--ease);backdrop-filter:blur(12px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script>
const CONTENT={"zh": [{"scene": "cover", "kicker": "كتاب الواق واق · MIRROR OF MARVELS", "tag": "序章", "title": "跨文化之镜：中国民间的“草木生灵”传说", "subtitle": "一册阿拉伯风电子绘本：瓦克瓦克树、凤凰木夜色与丝路想象", "paragraphs": ["在古代世界，植物、动物与人的边界并不总是坚固。树可以长出人的脸、舌、头颅，甚至孩子；远方也可以长出一个文明用来解释未知的镜像。", "这个融合版把三个项目收束为一本会呼吸的打开书：入口保留三语选择，视觉继承凤凰木的深红夜色、暖象牙文字与花火感，交互则吸收瓦克瓦克树的翻页、章节和左页动态插画。"], "quote": "远方不是地图上的空白，而是想象力互相投射的镜面。"}, {"scene": "china", "kicker": "一 · 草木生灵", "tag": "中国志怪", "title": "中国志怪中的“人形之树”", "subtitle": "《山海经》《搜神记》《酉阳杂俎》《太平广记》", "paragraphs": ["唐代《酉阳杂俎》写道：“大食国有树，长如人形，生小儿。”一句话把会生人的奇树放在阿拉伯世界的远方。", "《山海经·西山经》里，植物、动物与人的边界本就流动：有草如葵、赤花黄实、状似婴儿之舌，食之不惑；又有沙棠，果如枣而无核，食之不溺。", "干宝《搜神记》记录“木生人状”：枝如人头，眉目须具；倒木生枝如人形，身青黄、面白、头有髭发。宋代《太平广记》又把“人首花”与“小儿树”整理成更稳定的传说类型。"], "quote": "在志怪传统里，草木不是背景，而是另一种可能的生命。"}, {"scene": "mirror", "kicker": "二 · 互相推诿", "tag": "跨文化之镜", "title": "“这棵树在你那边”", "subtitle": "中国与阿拉伯文献中的远方投射", "paragraphs": ["最有趣的细节，是传说流动中的“互相推诿”。阿拉伯文献常把瓦克瓦克岛放在南中国海、靠近中国；《酉阳杂俎》却说“大食国有树生小儿”，又把奇闻推回阿拉伯。", "这不是敌意，更像远方想象的交换：双方都知道对方在自己够不到的地方，于是不可验证的奇迹便被安放在那里。", "丝绸之路不仅运送丝绸与香料，也运送故事。中国人听见阿拉伯水手带回来的南洋传说，阿拉伯人也通过印度洋航线想象东方草木，双方共同拼出这棵“人形树”。"], "quote": "文明相遇，有时不是刀剑，而是把不可思议的故事交给彼此。"}, {"scene": "book", "kicker": "三 · كتاب البلهان", "tag": "手抄本", "title": "《奇迹之书》与贾拉伊尔王朝", "subtitle": "14世纪巴格达的惊奇、神秘学与宫廷政治", "paragraphs": ["《奇迹之书》（Kitāb al-Bulhān，意为“惊奇之书”）约1399年前后制成于巴格达，是一部包含细密画、占星、镇尼与奇闻的阿拉伯手抄本。", "抄本编纂者阿卜杜·哈桑·本·艾哈迈德·伊斯法哈尼自称“真主仆从中最孱弱之人”，却记录了召唤镇尼、绘制符咒与诸多被视为禁忌的知识。", "它成册之际，正值贾拉伊尔王朝末期。对一位处在动荡政治中的君主而言，掌握超自然智慧不仅是个人趣味，也可以成为统治权威的象征。"], "quote": "一位能看透天命的君王，在14世纪的宫廷里本身就是一种政治语言。"}, {"scene": "dark", "kicker": "四 · 黑暗知识", "tag": "宗教与禁忌", "title": "为什么这些知识被视为“黑暗”？", "subtitle": "sihr、占卜与写给当真的人的操作手册", "paragraphs": ["在伊斯兰教法层面，魔法（sihr）被视为大罪，因为只有真主知晓未见之事，人类试图通过魔法、占星或召唤窥探未来，本质上是在僭越神圣属性。", "这类手抄本之所以危险，不是因为它们像现代奇幻小说一样讲述虚构，而是因为它们更像操作手册：写明名字、仪式、符号与步骤，读者原则上可以照着做。", "所以“黑暗知识”的核心不在于想象，而在于把想象当作可以实践的权力。"], "quote": "危险的不是想象，而是把想象当成可操作的权力。"}, {"scene": "jinn", "kicker": "五 · جِنّ", "tag": "阿拉伯传统", "title": "镇尼是什么？", "subtitle": "被遮蔽者、无烟之火与自由意志", "paragraphs": ["镇尼（جِنّ / jinn）来自阿拉伯语 الجن，字面意思是“被遮蔽的”或“隐匿的”，因为人眼不可见。", "在伊斯兰传统中，镇尼是真主以无烟之火创造的超自然存在。它们像人类一样拥有自由意志，有善有恶，有信仰者，也有作恶者。", "中世纪召唤仪式常以镇尼为目标。文学中的神灯精灵，也可被理解为镇尼的一种故事化形态。"], "quote": "镇尼不是单纯的怪物，而是一种与人类平行、被火与隐匿定义的生命。"}, {"scene": "sources", "kicker": "六 · 三条来路", "tag": "文献层", "title": "瓦克瓦克树的来源", "subtitle": "扎库姆、贾希兹、加兹温尼与安达卢西亚版本", "paragraphs": ["瓦克瓦克树并不出自《古兰经》。后世有时把它与地狱中的扎库姆树混淆，但扎库姆是惩罚之树，果实如魔鬼头颅，与瓦克瓦克的海岛传说并非同一系统。", "贾希兹《动物之书》提到瓦克瓦克，称它们仿佛是植物与动物之间的产物。到加兹温尼《造物奇观》里，瓦克瓦克岛上有树会发出“واق واق”的声音。", "安达卢西亚版本偏爱少女果实，波斯版本则更诡谲：枝头挂着男子、女子、鸟兽与怪物的头颅，像命运在树上开花。"], "quote": "同一棵树，在不同文献中结出不同的果实。"}, {"scene": "waqwaq", "kicker": "七 · واق واق", "tag": "形象变体", "title": "为什么有的版本只结女人？", "subtitle": "海上商人、异域幻想与命运焦虑", "paragraphs": ["并非所有版本都只结女人。波斯传统明确让瓦克瓦克树结出男子、女子和怪物的头颅。更准确地说：有些文本写女人，有些文本写男女皆有。", "只结女子的版本，可能来自男性商旅的海上想象：漫长航行里，长满美丽少女的神树是一种异域幻想。", "而波斯史诗传统中，男子头颅与怪物头颅的出现，或许更接近战乱时代对于命运、死亡与男性战士结局的焦虑。"], "quote": "同一棵树，有时是欲望的剧场，有时是命运的法庭。"}, {"scene": "alexander", "kicker": "八 · سکندر", "tag": "波斯史诗", "title": "亚历山大为什么要问这棵树？", "subtitle": "《列王纪》中的会说话占卜树", "paragraphs": ["在波斯传统中，瓦克瓦克树是一棵会说话的占卜树。亚历山大（Sekandar）远征至世界尽头时遇见它，向它询问自己的命运。", "树上的人头果实开口预言：你即将死去，你不能回到故土，王国将会分裂。它像德尔斐神谕，却更直接、更残酷。", "这让瓦克瓦克树从海岛奇观变成命运机器：它不只是长出人，而是让人面对终点。"], "quote": "德尔斐给谜语，瓦克瓦克给判决。"}, {"scene": "island", "kicker": "九 · 想象地图", "tag": "地理幻象", "title": "瓦克瓦克岛到底在哪里？", "subtitle": "马达加斯加、苏门答腊、塞舌尔，或世界尽头的一声回音", "paragraphs": ["中世纪地理学家曾说瓦克瓦克盛产黄金，居民用黄金给狗做链条、给猴子做项圈。后来的地图又把它推向南中国海、印度洋和更远的东方。", "现代推测很多：马达加斯加、苏门答腊、塞舌尔……但瓦克瓦克或许从来不是一个固定坐标，而是阿拉伯海上世界对东方未知的想象性命名。", "它不存在于现代地图上，却存在于水手的讲述、宫廷学者的笔记和手抄本的细密画里。"], "quote": "瓦克瓦克岛不是坐标，而是中世纪世界尽头的一声回音。"}, {"scene": "miniature", "kicker": "十 · 细密画之艺", "tag": "视觉风格", "title": "阿拉伯绘画的瑰丽密码", "subtitle": "过渡期、朴拙线条与未被驯化的生命力", "paragraphs": ["《奇迹之书》的画风与后世精美波斯细密画不同。它不追求完全优雅的线条和宫廷化姿态，而更像在忠实记录一件奇事：这棵树上长了女人。", "正是这种朴拙，让它保留了14世纪巴格达手抄本绘画的历史刻度。后来的萨法维画师可以画得完美无瑕，但那是经过审美驯化的精致。", "这本融合版把这种“不完美的生命力”转译成网页：纸页呼吸、文字滑入、花瓣漂移、树在夜色中慢慢生长。"], "quote": "朴拙不是粗糙，而是传说尚未被驯服时留下的温度。"}, {"scene": "ending", "kicker": "尾声 · 呼吸的镜子", "tag": "尾声", "title": "一棵从未有人见过，却被很多人相信的树", "subtitle": "故事的归处", "paragraphs": ["瓦克瓦克树迷人的地方，不在它是否真实存在，而在它如何被不同文明接力：水手讲给学者，学者写进手抄本，画师画成树上的脸，读者几百年后重新打开。", "中国志怪把它推向“大食国”，阿拉伯文献把它放回靠近中国的海上。它在互相推诿中获得生命，也在互相想象中变得清晰。", "所有传说也许都是这样：它们不属于某一个地方，而属于那些愿意把故事继续讲下去的人。"], "quote": "故事结束时，树并没有消失，它只是换了一种语言继续生长。"}], "en": [{"scene": "cover", "kicker": "Kitāb al-Bulhān · Mirror of Marvels", "tag": "Prologue", "title": "A Cross-Cultural Mirror: Living Plants in Chinese Folklore", "subtitle": "An Arabic-inspired digital picturebook of the Waqwaq tree, flamboyant-tree night, and Silk Road imagination", "paragraphs": ["In the old world, the borders between plant, animal, and human were not always firm. Trees could grow faces, tongues, heads, and even children; distant lands became mirrors for explaining the unknown.", "This fused edition turns the three projects into one breathing open book: a trilingual entrance, the dark red and warm ivory aesthetics of the flamboyant-tree project, and the page-turning narrative of the Waqwaq book."], "quote": "The faraway is not a blank on the map, but a mirror where imaginations meet."}, {"scene": "china", "kicker": "I · Living Plants", "tag": "Chinese anomaly tales", "title": "Human-Shaped Trees in Chinese Strange Tales", "subtitle": "Shan Hai Jing, Soushen Ji, Youyang Zazu, and Taiping Guangji", "paragraphs": ["The Tang miscellany Youyang Zazu says: “In the land of the Arabs there is a tree shaped like a person; it bears little children.” The marvelous tree is placed in the Arab world.", "In the Classic of Mountains and Seas, the boundary between plant, animal, and human is already fluid: strange plants protect one from confusion or drowning.", "Gan Bao’s Soushen Ji records wood growing into human form, and Taiping Guangji later organizes such tales into types such as head-flowers and child-bearing trees."], "quote": "In anomaly tales, plants are not scenery; they are another form of life."}, {"scene": "mirror", "kicker": "II · Mutual Displacement", "tag": "Cross-cultural mirror", "title": "“The Tree Is on Your Side”", "subtitle": "How China and the Arabic world placed wonder in each other’s distance", "paragraphs": ["The delightful detail is mutual displacement. Arabic texts often place Waqwaq near China, while Youyang Zazu sends the child-bearing tree back to the Arab world.", "This was not hostility, but an exchange of horizons: unverifiable marvels could live in the place beyond one’s reach.", "The Silk Roads carried more than silk and spices. They also carried rumors, marvels, and shared images of the impossible."], "quote": "Civilizations sometimes meet not with swords, but by handing each other unbelievable stories."}, {"scene": "book", "kicker": "III · Kitāb al-Bulhān", "tag": "Manuscript", "title": "The Book of Wonders and the Jalayirids", "subtitle": "Marvels, occult sciences, and courtly politics in fourteenth-century Baghdad", "paragraphs": ["Kitāb al-Bulhān, the Book of Wonders, was produced around 1399 in Baghdad and is associated with astrology, jinn, marvels, and miniature painting.", "Its compiler, Abd al-Hasan ibn Ahmad al-Isfahani, recorded rituals, names, signs, and knowledge later treated as forbidden.", "In a fragile court, supernatural wisdom could become more than taste; it could become political charisma."], "quote": "A ruler who could read destiny was also speaking the language of power."}, {"scene": "dark", "kicker": "IV · Dark Knowledge", "tag": "Religion and taboo", "title": "Why Was This Knowledge Called Dark?", "subtitle": "Sihr, divination, and manuals written for believers", "paragraphs": ["In Islamic legal thought, magic is a grave sin because unseen knowledge belongs to God alone.", "Such manuscripts differ from modern fantasy. They do not merely tell stories; they list names, rituals, symbols, and procedures.", "The danger lies not in imagination itself, but in treating imagination as usable power."], "quote": "The dangerous thing is not fantasy, but fantasy turned into a tool of control."}, {"scene": "jinn", "kicker": "V · Jinn", "tag": "Arabic tradition", "title": "What Are Jinn?", "subtitle": "The hidden ones, smokeless fire, and free will", "paragraphs": ["Jinn comes from the Arabic al-jinn, meaning beings that are hidden or concealed from human sight.", "In Islamic tradition, jinn are created from smokeless fire and possess free will. Some are righteous; others are not.", "Medieval rituals often sought to summon or command them; the genie of the lamp is a literary descendant of this world."], "quote": "Jinn are not merely monsters, but parallel beings defined by fire and concealment."}, {"scene": "sources", "kicker": "VI · Three Routes", "tag": "Sources", "title": "Where the Waqwaq Tree Comes From", "subtitle": "Zaqqum, al-Jahiz, al-Qazwini, and Andalusian versions", "paragraphs": ["The Waqwaq tree is not Qur'anic. It was sometimes confused with Zaqqum, the tree of punishment in hell, but the two belong to different traditions.", "Al-Jahiz described Waqwaq-like beings as offspring between plants and animals; al-Qazwini wrote of an island where trees seemed to cry “Waq Waq.”", "Andalusian versions favor maiden-fruits, while Persian accounts can fill the branches with human, animal, and monstrous heads."], "quote": "The same tree bears different fruit in different books."}, {"scene": "waqwaq", "kicker": "VII · Waq Waq", "tag": "Image variants", "title": "Why Do Some Versions Bear Only Women?", "subtitle": "Sailors, exotic fantasy, and anxiety about fate", "paragraphs": ["Not all versions bear only women. Persian traditions also show male and monstrous heads.", "Maiden-fruit versions may reflect the imagination of male travelers at sea, where distant islands became theaters of desire.", "The Persian branches full of heads feel darker: a world where the tree becomes a court of fate."], "quote": "The same tree can be a theater of desire or a tribunal of destiny."}, {"scene": "alexander", "kicker": "VIII · Sekandar", "tag": "Persian epic", "title": "Why Did Alexander Ask the Tree?", "subtitle": "The speaking oracle tree in the Shāhnāmeh", "paragraphs": ["In Persian tradition, the Waqwaq tree becomes an oracle. Alexander, or Sekandar, meets it at the world’s edge.", "The human-headed fruit foretells his death, his failure to return home, and the division of his kingdom.", "It is like Delphi, but more direct and cruel: not a riddle, but a verdict."], "quote": "Delphi gives riddles; Waqwaq gives judgment."}, {"scene": "island", "kicker": "IX · Imagined Map", "tag": "Geography of wonder", "title": "Where Is Waqwaq Island?", "subtitle": "Madagascar, Sumatra, Seychelles, or an echo at the edge of the world", "paragraphs": ["Medieval geographers described Waqwaq as rich in gold; later maps pushed it toward the South China Sea, the Indian Ocean, and other eastern waters.", "Modern guesses include Madagascar, Sumatra, and the Seychelles. Yet Waqwaq may never have been a fixed coordinate.", "It lives in sailors’ stories, courtly notes, and manuscript paintings rather than on a modern map."], "quote": "Waqwaq is not a coordinate, but an echo from the medieval edge of the world."}, {"scene": "miniature", "kicker": "X · Miniature Art", "tag": "Visual language", "title": "The Splendid Code of Arabic Painting", "subtitle": "Transitional style, awkward lines, and untamed vitality", "paragraphs": ["The Book of Wonders does not look like later polished Persian miniatures. It is less courtly and more documentary: it wants you to see that women grow from the tree.", "Its awkwardness preserves the historical pulse of fourteenth-century Baghdad manuscript culture.", "This fused edition translates that vitality into interface: breathing pages, drifting petals, night-red light, and a tree growing through text."], "quote": "Awkwardness is not failure; it is the warmth of a legend before it is tamed."}, {"scene": "ending", "kicker": "Epilogue · Breathing Mirror", "tag": "Ending", "title": "A Tree No One Has Seen, Yet Many Believed", "subtitle": "Where the story returns", "paragraphs": ["The Waqwaq tree fascinates because it travels: sailors tell scholars, scholars write manuscripts, painters turn it into faces, and later readers reopen it.", "Chinese anomaly tales send it to the Arab world; Arabic texts send it back toward China. Through this exchange, the tree becomes clearer.", "Perhaps all legends belong not to one place, but to those willing to keep telling them."], "quote": "When the story ends, the tree does not vanish; it grows in another language."}], "ar": [{"scene": "cover", "kicker": "كتاب الواق واق · مرآة العجائب", "tag": "مقدمة", "title": "مرآة عابرة للثقافات: أرواح النبات في الحكايات الصينية", "subtitle": "كتاب مصوّر بروح عربية عن شجرة الواق واق، وليلة البونسيانا، وخيال طريق الحرير", "paragraphs": ["في العالم القديم لم تكن الحدود بين النبات والحيوان والإنسان صلبة دائماً. قد تنبت الشجرة وجهاً أو لساناً أو رأساً أو طفلاً، وقد يصير البعيد مرآةً لما لا نعرفه.", "هذا العمل يمزج المشاريع الثلاثة في كتاب واحد يتنفس: مدخل بثلاث لغات، وجماليات الليل الأحمر والعاج الدافئ من مشروع البونسيانا، وسرد الصفحات المتقلبة من مشروع الواق واق."], "quote": "البعيد ليس فراغاً على الخريطة، بل مرآة تتبادل فيها المخيلات صورها."}, {"scene": "china", "kicker": "١ · نبات ذو روح", "tag": "حكايات صينية عجيبة", "title": "الأشجار ذات الهيئة البشرية في كتب العجائب الصينية", "subtitle": "من شان هاي جينغ إلى سوشن جي ويويانغ زازو", "paragraphs": ["يذكر كتاب يويانغ زازو من عصر تانغ: «في بلاد العرب شجرة على هيئة الإنسان، تنبت أطفالاً صغاراً». هكذا وُضعت الشجرة العجيبة في عالم العرب البعيد.", "في كتاب الجبال والبحار تبدو الحدود بين النبات والحيوان والإنسان قابلة للتحول؛ نبات يحمي من الحيرة، وشجرة يقال إن ثمرها يحمي من الغرق.", "وسجل غان باو أخبار الخشب الذي ينبت على هيئة بشر، ثم جمع تايبينغ غوانغجي هذه الخرافات في صور أكثر ثباتاً، مثل زهرة الرأس وشجرة الأطفال."], "quote": "في أدب العجائب، النبات ليس خلفية، بل احتمال آخر للحياة."}, {"scene": "mirror", "kicker": "٢ · إحالة متبادلة", "tag": "مرآة ثقافية", "title": "هذه الشجرة عندكم", "subt document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{state.started=true;setLang(b.dataset.lang);overlay.classList.add('hide');showToast(ui().touch)}));document.querySelectorAll('[data-mini-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.miniLang)));document.getElementById('nextBtn').addEventListener('click',next);document.getElementById('prevBtn').addEventListener('click',prev);document.getElementById('readBtn').addEventListener('click',toggleReading);document.getElementById('overviewBtn').addEventListener('click',overview);document.getElementById('restartBtn').addEventListener('click',()=>{overlay.classList.remove('hide');state.reading=false;clearInterval(state.timer)});textStage.addEventListener('click',()=>state.reading?advanceParagraph():next());window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' ')toggleReading()});

function drawBackground(scene){const mx=(state.mouse.x-.5)*20,my=(state.mouse.y-.5)*16;const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#170806');g.addColorStop(.45,'#572517');g.addColorStop(1,'#082230');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.24;for(let i=0;i<72;i++){const x=(Math.sin(i*91.7+state.time*.002)*.5+.5)*W+mx*.25;const y=(Math.cos(i*43.3)*.5+.5)*H*.72+my*.2;ctx.fillStyle=i%5?'#ffe8aa':'#fff';ctx.beginPath();ctx.arc(x,y,(i%3+1)*.45,0,Math.PI*2);ctx.fill()}ctx.restore();ctx.save();ctx.strokeStyle='rgba(255,220,160,.18)';ctx.lineWidth=1.2;for(let a=0;a<4;a++){ctx.beginPath();ctx.ellipse(W*(.5+a*.025-.04)+mx*.2,H*.63+my*.1,W*(.32-a*.045),H*(.72-a*.085),0,Math.PI,Math.PI*2);ctx.stroke()}ctx.restore();const desert=ctx.createLinearGradient(0,H*.62,0,H);desert.addColorStop(0,'rgba(241,190,103,.18)');desert.addColorStop(1,'rgba(47,22,9,.80)');ctx.fillStyle=desert;ctx.beginPath();ctx.moveTo(0,H*.70);for(let x=0;x<=W;x+=28)ctx.lineTo(x,H*.70+Math.sin(x*.012+state.time*.015)*8+Math.sin(x*.025)*6);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill()}
function drawMoon(){ctx.save();ctx.translate(W*.78,H*.18);ctx.shadowColor='rgba(255,220,160,.65)';ctx.shadowBlur=28;ctx.fillStyle='rgba(255,239,196,.92)';ctx.beginPath();ctx.arc(0,0,Math.min(W,H)*.065,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(Math.min(W,H)*.028,-Math.min(W,H)*.01,Math.min(W,H)*.06,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawSilkRoute(){const L=labels();ctx.save();ctx.globalAlpha=.76;ctx.strokeStyle='rgba(255,220,160,.65)';ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(W*.13,H*.58);ctx.bezierCurveTo(W*.31,H*.30,W*.57,H*.72,W*.84,H*.42);ctx.stroke();ctx.setLineDash([]);[[L.china,.14,.59],[L.arab,.5,.49],[L.waq,.83,.43]].forEach(([t,xp,yp])=>{const x=xp*W,y=yp*H;ctx.fillStyle='rgba(255,245,214,.94)';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.font=`${Math.max(12,W*.027)}px ${state.lang==='ar'?'Amiri':'serif'}`;ctx.textAlign='center';ctx.fillText(t,x,y-12)});ctx.restore()}
function drawFaceFruit(x,y,s){ctx.save();ctx.translate(x,y);ctx.fillStyle='#d7a56b';ctx.strokeStyle='rgba(64,31,17,.75)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,s*.66,s*.9,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#3c1f16';ctx.beginPath();ctx.arc(-s*.2,-s*.08,s*.055,0,Math.PI*2);ctx.arc(s*.2,-s*.08,s*.055,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,s*.17,s*.18,0,Math.PI);ctx.stroke();ctx.strokeStyle='rgba(43,21,12,.55)';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*s*.18,-s*.75);ctx.quadraticCurveTo(i*s*.25,s*.08+Math.abs(i)*2,i*s*.12,s*.94);ctx.stroke()}ctx.restore()}
function branch(x,y,len,ang,depth,prog,variant){if(depth>8||len<4)return;const local=clamp(prog-depth*.085,0,1);if(local<=0)return;const ex=x+Math.cos(ang)*len*local,ey=y+Math.sin(ang)*len*local;ctx.strokeStyle=variant==='dark'?'#2e180e':'#60351d';ctx.lineWidth=Math.max(1,8-depth*.75)*local;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo((x+ex)/2+Math.sin(state.time*.014+depth)*6,(y+ey)/2,ex,ey);ctx.stroke();if(depth>2){for(let i=0;i<2+(depth%3);i++){const t=(i+.35)/(2+(depth%3));const lx=lerp(x,ex,t)+Math.sin(state.time*.025+i+depth)*3,ly=lerp(y,ey,t);ctx.save();ctx.translate(lx,ly);ctx.rotate(ang+Math.sin(state.time*.02+i)*.22);ctx.globalAlpha=.76;ctx.fillStyle=variant==='dark'?'#254a3d':'#2f7656';ctx.beginPath();ctx.ellipse(0,0,Math.max(2,7-depth*.42),3,0,0,Math.PI*2);ctx.fill();ctx.restore()}}if(depth>4&&local>.78){ctx.save();ctx.translate(ex,ey);ctx.rotate(Math.sin(state.time*.035+depth)*.08);if((depth+variant.length)%3===0)drawFaceFruit(0,0,Math.max(7,14-depth*.7));else{ctx.fillStyle=variant==='rose'?'#c95766':'#d7a451';ctx.beginPath();ctx.arc(0,0,Math.max(2.3,5-depth*.32),0,Math.PI*2);ctx.fill()}ctx.restore()}const split=.54+Math.sin(depth)*.07;branch(ex,ey,len*split,ang-.45-depth*.025,depth+1,prog,variant);branch(ex,ey,len*(split*.92),ang+.42+depth*.015,depth+1,prog,variant);if(depth%2===0)branch(ex,ey,len*.45,ang+Math.sin(depth)*.7,depth+1,prog,variant)}
function drawTree(scene){const prog=clamp((state.index+1)/pages().length*1.17,.16,1);ctx.save();ctx.translate(W*.5,H*.77);branch(0,0,H*.30,-Math.PI/2,0,prog,scene==='dark'?'dark':scene==='waqwaq'?'rose':'normal');ctx.restore()}
function drawBookSymbol(){ctx.save();ctx.translate(W*.5,H*.52);ctx.rotate(Math.sin(state.time*.01)*.018);ctx.fillStyle='rgba(255,239,202,.82)';ctx.strokeStyle='rgba(77,43,19,.80)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-W*.22,-H*.12);ctx.quadraticCurveTo(-W*.07,-H*.17,0,-H*.08);ctx.quadraticCurveTo(W*.07,-H*.17,W*.22,-H*.12);ctx.lineTo(W*.2,H*.13);ctx.quadraticCurveTo(W*.07,H*.08,0,H*.16);ctx.quadraticCurveTo(-W*.07,H*.08,-W*.2,H*.13);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='rgba(120,74,28,.34)';for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(-W*.16,-H*.08+i*H*.026);ctx.quadraticCurveTo(-W*.06,-H*.11+i*H*.025,-W*.01,-H*.04+i*H*.018);ctx.stroke();ctx.beginPath();ctx.moveTo(W*.02,-H*.06+i*H*.023);ctx.quadraticCurveTo(W*.10,-H*.11+i*H*.024,W*.17,-H*.07+i*H*.027);ctx.stroke()}ctx.fillStyle='#9d3f4d';ctx.font=`${Math.max(18,W*.064)}px Amiri,serif`;ctx.textAlign='center';ctx.fillText(labels().book,0,-H*.005);ctx.restore()}
function drawJinn(){ctx.save();ctx.translate(W*.5,H*.60);for(let i=0;i<8;i++){const r=(i*18+state.time*.55)%150;ctx.strokeStyle=`rgba(81,180,171,${.42-i*.04})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(Math.sin(i)*16,-r*.75,H*.10-r*.0004,H*.03+r*.0002,Math.sin(state.time*.01+i),0,Math.PI*2);ctx.stroke()}ctx.fillStyle='rgba(89,203,190,.16)';ctx.beginPath();ctx.moveTo(-W*.08,H*.08);ctx.bezierCurveTo(-W*.18,-H*.10,-W*.02,-H*.28,0,-H*.40);ctx.bezierCurveTo(W*.10,-H*.25,W*.20,-H*.08,W*.07,H*.10);ctx.quadraticCurveTo(0,H*.18,-W*.08,H*.08);ctx.fill();ctx.fillStyle='rgba(255,230,150,.9)';ctx.font=`${Math.max(22,W*.08)}px Amiri,serif`;ctx.textAlign='center';ctx.fillText(labels().jinn,0,-H*.12);ctx.restore()}
function drawIsland(){ctx.save();ctx.translate(W*.5,H*.64);ctx.fillStyle='rgba(216,168,79,.55)';ctx.beginPath();ctx.ellipse(0,0,W*.26,H*.055,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,220,160,.55)';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(0,0,W*(.17+i*.036),Math.PI*.08,Math.PI*.92);ctx.stroke()}ctx.fillStyle='rgba(255,245,214,.85)';ctx.font=`${Math.max(13,W*.032)}px ${state.lang==='ar'?'Amiri':'serif'}`;ctx.textAlign='center';ctx.fillText(labels().island,0,-H*.09);ctx.restore()}
function drawMiniature(){ctx.save();ctx.translate(W*.5,H*.48);for(let i=0;i<5;i++){ctx.fillStyle=i%2?'rgba(201,87,102,.22)':'rgba(255,220,160,.24)';ctx.strokeStyle='rgba(80,45,20,.45)';ctx.beginPath();ctx.roundRect(-W*.24+i*W*.095,-H*.17+Math.sin(state.time*.02+i)*4,W*.075,H*.22,10);ctx.fill();ctx.stroke();ctx.save();ctx.translate(-W*.202+i*W*.095,-H*.04);drawFaceFruit(0,0,Math.max(9,W*.025));ctx.restore()}ctx.restore()}
function drawSymbols(scene){if(scene==='mirror'||scene==='china')drawSilkRoute();if(scene==='book'||scene==='dark')drawBookSymbol();if(scene==='jinn'||scene==='dark')drawJinn();if(scene==='island'||scene==='sources')drawIsland();if(scene==='miniature'||scene==='alexander')drawMiniature();if(scene==='cover'||scene==='ending'){ctx.save();ctx.fillStyle='rgba(255,220,160,.85)';ctx.font=`${Math.max(32,W*.12)}px Amiri,serif`;ctx.textAlign='center';ctx.fillText('واق واق',W*.5,H*.38);ctx.restore()}}
function drawParticles(){for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.012;p.life-=.012;if(p.life<=0){state.particles.splice(i,1);continue}ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(state.time*.02+i);ctx.fillStyle=p.h>.5?'#ffdca0':'#c95766';ctx.beginPath();ctx.moveTo(0,-5);ctx.quadraticCurveTo(6,-1,0,8);ctx.quadraticCurveTo(-6,-1,0,-5);ctx.fill();ctx.restore()}}
function animate(){state.time++;const p=pages()[state.index];drawBackground(p.scene);drawMoon();drawSymbols(p.scene);drawTree(p.scene);drawParticles();requestAnimationFrame(animate)}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
setLang('zh');animate();
